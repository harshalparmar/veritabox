<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Workshop Participant ID — VeritaBox</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef2f5;--paper:#f7faff;--ink:#0f2030;--line:#b8c7d4;--navy:#163a5f;--orange:#ee7c30;--muted:#5a6e7f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:min(360px,92vw);aspect-ratio:54/86;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;position:relative;overflow:hidden;
    box-shadow:0 20px 50px -20px rgba(22,58,95,.25);
    background-image:linear-gradient(rgba(22,58,95,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(22,58,95,.06) 1px,transparent 1px);
    background-size:18px 18px;background-position:-1px -1px;}
  .strap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:12px;background:var(--navy);border-radius:0 0 6px 6px}
  .head{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:10px}
  .logo{display:flex;align-items:center;gap:6px;color:var(--navy);font-weight:700;letter-spacing:.06em}
  .logo .glyph{width:14px;height:14px;border:1.5px solid var(--navy);transform:rotate(45deg);position:relative}
  .logo .glyph::after{content:"";position:absolute;inset:2.5px;background:var(--orange)}
  .role{padding:3px 8px;background:var(--orange);color:#fff;border-radius:2px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase}
  .scheme{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--orange);letter-spacing:.22em;text-transform:uppercase}
  h1{margin:4px 0 0;font-size:26px;font-weight:700;line-height:1.05;letter-spacing:-.01em;color:var(--navy)}
  .sub{margin-top:6px;font-size:12px;color:var(--muted)}
  .photo{margin:14px auto 8px;width:96px;height:96px;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;background:#fff}
  .name{text-align:center;font-size:18px;font-weight:700;color:var(--ink)}
  .college{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px}
  .meta{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .meta b{display:block;color:var(--ink);font-family:'Inter';font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;margin-top:2px}
  .foot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
  .qr{width:72px;height:72px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:4px;display:grid;place-items:center}
  .verify{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);text-align:right;line-height:1.5}
  .verify .id{color:var(--navy);font-weight:700;font-size:11px}
  .verify b{color:var(--orange)}
  @media print{html,body{background:#fff;padding:0}.card{box-shadow:none}}
</style>
</head>
<body
  data-participantname="Devika Rao"
  data-college="VIT Vellore"
  data-eventname="Embedded Systems Bootcamp"
  data-eventdate="Sep 21 – 22, 2026"
  data-venue="Pune · VeritaBox Lab 03"
  data-credentialid="STK-WSP-26-0307"
  data-verifyurl="https://veritabox.com/verify/STK-WSP-26-0307">
  <div class="card">
    <div class="strap"></div>
    <div class="head">
      <div class="logo"><span class="glyph"></span> VeritaBox · LAB</div>
      <div class="role">Participant</div>
    </div>
    <div class="scheme">▤ WORKSHOP MODULE</div>
    <h1 data-token="eventname">Embedded Systems Bootcamp</h1>
    <div class="sub">Hands-on certification track · 2 days</div>

    <div class="photo">PHOTO</div>
    <div class="name" data-token="participantname">Devika Rao</div>
    <div class="college" data-token="college">VIT Vellore</div>

    <div class="meta">
      <div>Date<b data-token="eventdate">Sep 21 – 22, 2026</b></div>
      <div>Venue<b data-token="venue">Pune · Lab 03</b></div>
      <div>Seat<b>R-04 · S-12</b></div>
      <div>Kit<b>STM32 + Sensors</b></div>
    </div>

    <div class="foot">
      <div class="qr" id="qr"></div>
      <div class="verify">
        <span class="id" data-token="credentialid">STK-WSP-26-0307</span><br/>
        verify · <b data-token="verifyurl">veritabox.com/verify/…</b><br/>
        scan to authenticate
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="../_shared/qr.js"></script>
<script>
  hydrateTokens();
  renderQR('#qr', document.body.dataset.verifyurl, { size: 140, dark:'#163a5f' });
</script>
</body></html>
