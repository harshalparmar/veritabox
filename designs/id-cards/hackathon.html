<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hackathon Squadron ID — VeritaBox</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a; --panel:#0a0f14; --line:#1b2630;
    --cyan:#22d3ee; --green:#4ade80; --amber:#fbbf24; --fg:#e6f1ff; --muted:#7a8a99;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(1200px 600px at 20% 0%, #0a1924 0%, var(--bg) 60%);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{
    width:min(360px,92vw); aspect-ratio: 54/86; background:linear-gradient(180deg,#0b1218,#070a0d);
    border:1px solid var(--line); border-radius:18px; padding:18px; position:relative; overflow:hidden;
    box-shadow:0 0 0 1px #000 inset, 0 30px 80px -20px rgba(34,211,238,.25), 0 0 60px -20px rgba(74,222,128,.2);
  }
  .card::before{content:"";position:absolute;inset:0;background:
    linear-gradient(transparent 95%, rgba(34,211,238,.08) 95%) 0 0/100% 14px,
    linear-gradient(90deg, transparent 95%, rgba(34,211,238,.06) 95%) 0 0/14px 100%;
    pointer-events:none;mask:radial-gradient(circle at 50% 30%,#000 30%,transparent 75%);}
  .strap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:54px;height:14px;background:#000;border-radius:0 0 8px 8px;border:1px solid var(--line);border-top:0}
  .strap::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:18px;height:5px;background:var(--line);border-radius:3px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted)}
  .logo{display:flex;align-items:center;gap:6px;color:var(--cyan);font-weight:700;letter-spacing:.06em}
  .logo .glyph{width:14px;height:14px;border:1.5px solid var(--cyan);transform:rotate(45deg);display:inline-block;position:relative}
  .logo .glyph::after{content:"";position:absolute;inset:2.5px;background:var(--green);opacity:.5}
  .role{padding:3px 8px;border:1px solid var(--green);color:var(--green);border-radius:999px;font-size:9.5px;text-transform:uppercase;letter-spacing:.18em}
  .event{margin:14px 0 6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.22em}
  .squadron{font-size:26px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
  .squadron span{color:var(--cyan)}
  .meta{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .meta b{display:block;color:var(--fg);font-weight:500;font-family:'Space Grotesk';font-size:12.5px;margin-top:2px}
  .members{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .members h4{margin:0 0 6px;font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase}
  .members ul{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:12px}
  .members li{display:flex;justify-content:space-between;gap:8px}
  .members li::before{content:"▸";color:var(--green);margin-right:4px}
  .members li span:last-child{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10.5px}
  .foot{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
  .qr{width:78px;height:78px;background:#fff;border-radius:8px;padding:5px;display:grid;place-items:center}
  .verify{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);line-height:1.5;text-align:right}
  .verify b{color:var(--cyan);font-weight:500}
  .verify .id{color:var(--green);font-size:11px;letter-spacing:.05em}
  .scan{margin-top:4px;display:inline-flex;align-items:center;gap:4px;color:var(--amber)}
  @media print{ html,body{background:#fff;padding:0} .card{box-shadow:none;border-color:#000} }
</style>
</head>
<body
  data-participantname="Alex Mercer"
  data-squadronname="VOID//RUNNERS"
  data-college="IIT Bombay"
  data-eventname="Stacked National Hackathon '26"
  data-eventdate="Aug 12 – 14, 2026"
  data-venue="Bengaluru · NIMHANS Convention"
  data-credentialid="STK-HCK-26-0042"
  data-verifyurl="https://veritabox.com/verify/STK-HCK-26-0042">
  <div class="card">
    <div class="strap"></div>
    <div class="head">
      <div class="logo"><span class="glyph"></span> VeritaBox</div>
      <div class="role">SQUADRON</div>
    </div>
    <div class="event" data-token="eventname">Stacked National Hackathon '26</div>
    <div class="squadron"><span>//</span> <span data-token="squadronname">VOID//RUNNERS</span></div>
    <div class="meta">
      <div>DATE<b data-token="eventdate">Aug 12 – 14, 2026</b></div>
      <div>VENUE<b data-token="venue">Bengaluru</b></div>
      <div>COLLEGE<b data-token="college">IIT Bombay</b></div>
      <div>TRACK<b>Open · 36h</b></div>
    </div>
    <div class="members">
      <h4>// CREW</h4>
      <ul id="crew">
        <li><span>Alex Mercer</span><span>CAPT</span></li>
        <li><span>Riya Shah</span><span>ENG</span></li>
        <li><span>Kabir Joshi</span><span>ENG</span></li>
        <li><span>Mei Tanaka</span><span>DSGN</span></li>
      </ul>
    </div>
    <div class="foot">
      <div class="qr" id="qr"></div>
      <div class="verify">
        ID <span class="id" data-token="credentialid">STK-HCK-26-0042</span><br/>
        verify · <b data-token="verifyurl">veritabox.com/verify/…</b><br/>
        <span class="scan">▸ scan to authenticate</span>
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="../_shared/qr.js"></script>
<script>
  hydrateTokens();
  renderQR('#qr', document.body.dataset.verifyurl, { size: 140, dark:'#05070a' });
</script>
</body></html>
