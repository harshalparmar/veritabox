<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <style>
    .box { fill: #171717; }
    .box-light { fill: #171717; opacity: 0.4; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #ffffff; }
      .box-light { fill: #ffffff; opacity: 0.4; }
    }
  </style>
  <rect class="box" x="0" y="0" width="20" height="20" rx="2" />
  <rect class="box-light" x="26" y="0" width="20" height="20" rx="2" />
  <rect class="box" x="52" y="0" width="20" height="20" rx="2" />
  
  <rect class="box-light" x="0" y="26" width="20" height="20" rx="2" />
  <rect class="box" x="26" y="26" width="20" height="20" rx="2" />
  <rect class="box-light" x="52" y="26" width="20" height="20" rx="2" />
  
  <rect class="box" x="0" y="52" width="20" height="20" rx="2" />
  <rect class="box-light" x="26" y="52" width="20" height="20" rx="2" />
  <rect class="box" x="52" y="52" width="20" height="20" rx="2" />
</svg>
